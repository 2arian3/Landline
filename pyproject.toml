[project]
name = "landline"
version = "0.1.0"
description = "A voice agent that works for renters: live map, parallel calls to listing agents, memory by phone number."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "httpx>=0.27",
  "psycopg[binary,pool]>=3.2",
  "python-dotenv>=1.0",
  "websockets>=15",
  "logfire>=5.3.0",
  "clerk-backend-api>=7.0.0",
  "google-genai>=1.0",
  "audioop-lts>=0.2.1 ; python_full_version >= '3.13'",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
]

[tool.uv]
package = false
# cryptography 49 and 50 (from clerk-backend-api) ship no Intel-Mac wheel and their source builds fail there, so
# Intel Macs stay on the last release that has one. The VM, CI and Apple-silicon Macs are unaffected.
constraint-dependencies = ["cryptography<49 ; sys_platform == 'darwin' and platform_machine == 'x86_64'"]

[tool.logfire]
# app.py calls logfire.configure() only when LOGFIRE_TOKEN is set. Without it the tool spans in
# voice/bridge.py do nothing, and this keeps them from warning that Logfire isn't configured.
ignore_no_config = true

[tool.pytest.ini_options]
testpaths = ["server/tests", "pipeline/tests"]
pythonpath = ["server", "."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["server", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
