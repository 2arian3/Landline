# Landline API on the public gateway (134.87.8.230), proxied to the Landline VM
# over the private network. Installed as /etc/nginx/conf.d/landline.conf by
# deploy/nginx/install.sh.
#
# This file adds one server name and nothing else. caios.conf keeps the default
# servers, its certificates and its $connection_upgrade map; every name defined
# here starts with landline_ so it can't collide with anything there.
#
# CORS is answered by the API (deploy/production.env), so nginx passes Origin
# through and adds no Access-Control headers of its own.

map $http_upgrade $landline_connection {
    default upgrade;
    ''      '';
}

upstream landline_api {
    server 192.168.104.198:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name landline.134.87.8.230.sslip.io;

    location /.well-known/acme-challenge/ {
        root /var/www/landline-acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name landline.134.87.8.230.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/landline.134.87.8.230.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/landline.134.87.8.230.sslip.io/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 5m;

    location / {
        proxy_pass http://landline_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $landline_connection;

        # Server-sent events and, later, Twilio media streams: unbuffered and long-lived.
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
