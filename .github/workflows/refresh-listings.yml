# Re-scrape listings now. The schedule itself lives on the VM, next to the
# database it writes to (deploy/systemd/landline-refresh.timer, every 6 hours);
# this starts the same job on demand and shows its log.
#
# Safety: the run checks the scrape before loading (minimum listing count and
# coordinate coverage), so a site change or a block can never overwrite good
# data. Unseen listings are marked stale only after a complete run.
name: Refresh listings

on:
  workflow_dispatch:

concurrency:
  group: refresh-listings
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/landline-ssh
        with:
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

      - name: Scrape, check, load (on the VM)
        run: |
          start=$(ssh landline 'date -u "+%Y-%m-%d %H:%M:%S"')
          status=0
          ssh landline 'sudo systemctl start landline-refresh.service' || status=$?
          ssh landline "sudo journalctl -u landline-refresh --since '$start' --no-pager -o cat" | tee run.txt
          exit $status

      - name: Fetch this run's scrape
        if: always()
        # The newest timestamped file is this run's output, even when it failed its
        # check; livrent-latest.jsonl is only replaced by runs that pass.
        run: |
          newest=$(ssh landline 'ls -t landline/data/stages/normalize/livrent-2*.jsonl 2> /dev/null | head -1' || true)
          if [ -n "$newest" ]; then scp "landline:$newest" . || true; fi

      - name: Upload the run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: listings-${{ github.run_id }}
          path: |
            run.txt
            livrent-2*.jsonl
          if-no-files-found: ignore
          retention-days: 7
